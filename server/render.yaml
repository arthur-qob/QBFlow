services:
  - type: web
    name: packing-slip-generator
    runtime: python
    buildCommand: >
      apt-get install -y
      libpango-1.0-0
      libpangoft2-1.0-0
      libcairo2
      libgdk-pixbuf2.0-0
      libffi-dev
      fontconfig
      && pip install -r requirements.txt
    startCommand: gunicorn app:app
